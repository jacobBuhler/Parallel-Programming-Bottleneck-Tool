<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}OMPCheck{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            min-height: 100vh;
            background-color: #0f1115;
        }
        .navbar-brand {
            font-weight: 600;
            letter-spacing: 0.02em;
        }
        pre {
            background-color: var(--bs-tertiary-bg);
            color: var(--bs-body-color);
            padding: 1rem;
            border-radius: 0.5rem;
            max-height: 420px;
            overflow: auto;
            font-size: 0.85rem;
            margin-bottom: 0;
        }
        .plot-img {
            max-width: 100%;
            height: auto;
            border-radius: 0.4rem;
            border: 1px solid var(--bs-border-color);
            background-color: #fff;
        }
        .form-label {
            font-weight: 500;
        }
        .form-control, .form-select {
            padding: 0.6rem 0.85rem;
            font-size: 1rem;
        }
        textarea.form-control {
            min-height: 120px;
        }
        .meta-label {
            font-size: 0.8rem;
            color: var(--bs-secondary-color);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        .meta-value {
            font-size: 1rem;
            word-break: break-word;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg bg-body-tertiary border-bottom mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">OMPCheck</a>
            <div class="navbar-nav ms-auto align-items-center">
                {% if user.is_authenticated %}
                    <a class="nav-link" href="/analysis/new/">New Analysis</a>
                    <span class="nav-link text-secondary">{{ user.username }}</span>
                    <form method="post" action="/accounts/logout/" class="d-inline ms-2">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-outline-light btn-sm">Logout</button>
                    </form>
                {% else %}
                    <a class="nav-link" href="/accounts/login/">Login</a>
                    <a class="nav-link" href="/signup/">Sign up</a>
                {% endif %}
            </div>
        </div>
    </nav>

    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
